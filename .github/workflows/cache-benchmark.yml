name: Persistent control lookup benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-mirror
      - run: sudo apt-get update && sudo apt-get install -y cmake librocksdb-dev libssl-dev
      - name: Build current control-table benchmark
        run: |
          cmake -S . -B /tmp/cache-benchmark -DCMAKE_BUILD_TYPE=Release -DCACHE_PURGE_STORE_TESTS=ON
          cmake --build /tmp/cache-benchmark --target cache_purge_control_benchmark --parallel 2
      - name: Measure bounded control lookup
        run: |
          mkdir reports
          /tmp/cache-benchmark/cache_purge_control_benchmark > reports/single.json
          /tmp/cache-benchmark/cache_purge_control_benchmark --tag-groups > reports/two-tags.json
          /tmp/cache-benchmark/cache_purge_control_benchmark --tag-groups-64 > reports/64-tags.json
          printf '%s\n' 'Synthetic control-table lookup only; no HTTP, index enumeration or physical deletion throughput claim.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: control-lookup-results
          path: reports/
          retention-days: 7
