name: Foreground cache benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foreground:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-mirror
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config librocksdb-dev libssl-dev libpcre2-dev zlib1g-dev wrk
      - name: Fetch the native nginx baseline
        run: |
          curl --fail --location https://nginx.org/download/nginx-1.26.3.tar.gz -o /tmp/nginx.tar.gz
          echo '69ee2b237744036e61d24b836668aad3040dda461fe6f570f1787eab570c75aa  /tmp/nginx.tar.gz' | sha256sum --check
          tar -xzf /tmp/nginx.tar.gz -C /tmp
          git -C /tmp/nginx-1.26.3 init
          git -C /tmp/nginx-1.26.3 add .
          git -C /tmp/nginx-1.26.3 -c user.name=CI -c user.email=ci@example.invalid commit -m 'Native nginx source'
      - name: Build and verify the current implementation
        run: |
          python3 t/persistent_runtime.py --nginx /tmp/nginx-1.26.3 --reports reports/verification
      - name: Measure HIT latency during fills and background deletion
        run: |
          binary=$(python3 -c 'import json; print(json.load(open("reports/verification/public.json"))["root"] + "/nginx/objs/nginx")')
          python3 t/native_cache_benchmark.py --binary "$binary" --output reports/foreground.json \
            --workers 1 --server-cores 1 --owner-control --bulk 1024 --fills 1000 --fill-rate 200
          printf '%s\n' 'Same-binary HTTP comparison on a shared CI runner; no production latency or memory guarantee.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: foreground-cache-results
          path: reports/
          retention-days: 7
