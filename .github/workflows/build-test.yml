name: Build & Test

on:
  push:
    branches: [ main, 'releases/**', 'dev/**' ]
    tags: ['5.*']
  pull_request:
    branches: [ main, 'releases/**', 'dev/**' ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Run the extended compatibility and Valgrind checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
  DOCKER_BUILDKIT: 1

jobs:
  prepare:
    name: Select checks
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.matrix.outputs.run }}
      full: ${{ steps.matrix.outputs.full }}
      integration: ${{ steps.matrix.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check APT mirror export
        run: python3 -m unittest discover -s .github/actions/apt-mirror -v
      - name: Check CI selection and failure handling
        run: python3 -m unittest discover -s t -p test_ci.py -v
      - name: Check persistent test failure handling
        run: python3 -m unittest discover -s t -p test_persistent_runtime.py -v
      - id: matrix
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL: ${{ github.event_name == 'schedule' || inputs.full || startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/releases/') }}
        run: perl t/ci_matrix.pl

  test-matrix:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    name: Persistent / ${{ matrix.name }} / ${{ matrix.core }} ${{ matrix.nginx }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.integration) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: apt
        uses: ./.github/actions/apt-mirror
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the persistent test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: t/Dockerfile
          target: integration
          build-args: |
            NGINX_VERSION=${{ matrix.nginx }}
            NGINX_VARIANT=${{ matrix.core }}
          secrets: ${{ steps.apt.outputs.buildkit_secret }}
          secret-files: apt_ca=/etc/ssl/certs/ca-certificates.crt
          tags: cache-purge-test:local
          load: true
          cache-from: type=gha,scope=persistent-${{ matrix.core }}-${{ matrix.nginx }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=min,ignore-error=true,scope=persistent-{0}-{1}', matrix.core, matrix.nginx) || '' }}
          provenance: false
      - name: Backend, native cache, four protocols and one-way propagation
        env:
          TEST_DYNAMIC: ${{ matrix.dynamic }}
          TEST_SANITIZE: ${{ matrix.sanitize }}
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          mkdir -p t/test-results
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e TEST_DYNAMIC -e TEST_SANITIZE -e CC -e CXX \
            --mount "type=bind,src=$PWD/t/test-results,dst=/reports" \
            cache-purge-test:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.name }}-${{ matrix.nginx }}
          path: t/test-results/
          retention-days: 7

  memory-leak-test:
    needs: prepare
    if: needs.prepare.outputs.run == 'true' && (github.event_name == 'pull_request' || needs.prepare.outputs.full == 'true')
    name: Valgrind / persistent store and index
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-mirror
      - run: sudo apt-get update && sudo apt-get install -y cmake librocksdb-dev libssl-dev valgrind
      - name: Build and check live storage APIs
        run: |
          cmake -S . -B /tmp/cache-valgrind -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCACHE_PURGE_STORE_TESTS=ON
          cmake --build /tmp/cache-valgrind --parallel 2
          mkdir -p t/test-results
          for suite in store catalog jobs; do
            valgrind --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=definite,indirect \
              --child-silent-after-fork=yes \
              --xml=yes --xml-file="t/test-results/$suite-valgrind.xml" \
              "/tmp/cache-valgrind/cache_purge_${suite}_test"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: valgrind-results
          path: t/test-results/
          retention-days: 7

  static-analysis:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    name: Cppcheck / persistent HTTP and backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-mirror
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config librocksdb-dev libssl-dev libpcre2-dev zlib1g-dev cppcheck
      - name: Analyze configured source trees
        run: |
          cmake -S . -B /tmp/cache-analysis -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build /tmp/cache-analysis --parallel 2
          export CACHE_PURGE_ROCKSDB_LIB_DIR=/tmp/cache-analysis
          sh t/download.sh https://nginx.org/download/nginx-1.31.8.tar.gz /tmp/nginx-analysis.tar.gz
          mkdir /tmp/nginx-analysis
          tar -xzf /tmp/nginx-analysis.tar.gz --strip-components=1 -C /tmp/nginx-analysis
          NGINX_SOURCE=/tmp/nginx-analysis perl t/cppcheck.pl
          # The successful backend compile already enforces this compiler builtin.
          cppcheck --project=/tmp/cache-analysis/compile_commands.json -D__GCC_ATOMIC_LLONG_LOCK_FREE=2 --enable=warning,performance,portability --error-exitcode=1

  semgrep-analysis:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/security-audit --config p/secrets --config p/c --error

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: [prepare, test-matrix, memory-leak-test]
    if: always() && needs.prepare.outputs.run == 'true'
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: test-results
          pattern: test-results-*
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Test Results
          path: 'test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: true

  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [prepare, test-matrix, memory-leak-test, static-analysis, semgrep-analysis, publish-test-results]
    if: always()
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Check | Result |\n|---|---|\n')
              for name, job in jobs.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          failed = [name for name, job in jobs.items() if job['result'] in ('failure', 'cancelled')]
          if jobs['prepare']['result'] != 'success':
              failed.append('prepare')
          elif jobs['prepare']['outputs'].get('run') == 'true':
              for name, job in jobs.items():
                  if name == 'memory-leak-test' and os.environ['EVENT_NAME'] != 'pull_request' and jobs['prepare']['outputs'].get('full') != 'true':
                      continue
                  if job['result'] != 'success':
                      failed.append(name)
          raise SystemExit(1 if failed else 0)
          PYTHON
