# Disposable test containers only; no runtime database service is introduced.
x-test-base: &test-base
  image: ngx-cache-purge-test:${NGINX_VERSION:-1.31.7}-${UBUNTU_VERSION:-24.04}
  build:
    context: ..
    dockerfile: t/Dockerfile
    target: integration
    args:
      NGINX_VERSION: ${NGINX_VERSION:-1.31.7}
      UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ..:/src:ro
    - ./test-results:/reports
  environment:
    TEST_DYNAMIC: ${TEST_DYNAMIC:-false}
    TEST_SANITIZE: ${TEST_SANITIZE:-false}
    CC: ${CC:-gcc}
    CXX: ${CXX:-g++}

services:
  nginx-test:
    <<: *test-base
    command: ["python3", "t/persistent_runtime.py", "--reports", "/reports/run"]
  test-sanitize:
    <<: *test-base
    command: ["python3", "t/persistent_runtime.py", "--sanitize", "--reports", "/reports/asan"]
  test-pvs:
    image: ngx-cache-purge-pvs:${NGINX_VERSION:-1.31.7}-${UBUNTU_VERSION:-24.04}
    build:
      context: ..
      dockerfile: t/Dockerfile
      target: pvs-studio
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.31.7}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
    volumes:
      - ..:/src:ro
      - ./test-results:/reports
    cap_add: [SYS_PTRACE]
    environment:
      LICENSE_NAME: ${LICENSE_NAME:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      PVS_JOBS: ${PVS_JOBS:-2}
    command: ["bash", "t/pvs_studio.sh"]
