# Disposable test containers only; no runtime database service is introduced.
x-test-base: &test-base
  image: ngx-cache-purge-test:${NGINX_VARIANT:-nginx}-${NGINX_VERSION:-1.31.8}-${UBUNTU_VERSION:-24.04}
  build:
    context: ..
    dockerfile: t/Dockerfile
    target: integration
    args:
      NGINX_VERSION: ${NGINX_VERSION:-1.31.8}
      NGINX_VARIANT: ${NGINX_VARIANT:-nginx}
      UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ..:/src:ro
    - ./test-results:/reports
  environment:
    TEST_DYNAMIC: ${TEST_DYNAMIC:-false}
    TEST_SANITIZE: ${TEST_SANITIZE:-false}
    CC: ${CC:-gcc}
    CXX: ${CXX:-g++}

services:
  nginx-test:
    <<: *test-base
    command: ["python3", "t/persistent_runtime.py", "--reports", "/reports/${NGINX_VARIANT:-nginx}"]
  test-sanitize:
    <<: *test-base
    command: ["python3", "t/persistent_runtime.py", "--sanitize", "--reports", "/reports/${NGINX_VARIANT:-nginx}-asan"]
